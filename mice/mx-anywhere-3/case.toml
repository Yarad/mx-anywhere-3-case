# Carry case for the Logitech MX Anywhere 3: the mouse, its features and the design.
# Anything not set here comes from case/defaults.toml; the outer form and other
# geometry computed from the mouse are in derived.toml.
#
# Lengths in mm in the case frame: front of the mouse (USB-C, wheel) at -Y, top at +Z,
# the user's left (the side buttons of this mouse) at +X.

[mouse]
name = "Logitech MX Anywhere 3"
mesh = "Logitech MX Anywhere 3.stl"   # repository-relative, already in the case frame
source = "scan"                       # scan | dimensions
table_z = -0.57                       # the plane the feet stand on

# Zones the case keeps clear of: inside each box the gap grows to `gap` (soft 1.5 mm edges).
buttons = [
  { name = "wheel, SmartShift and main buttons", x = [-28.5, 28.5], y = [-inf, 15.0], z = [10.0, inf], gap = 3.0 },
  { name = "side buttons", x = [26.5, inf], y = [-27.0, -2.0], z = [13.0, 25.0], gap = 2.5 },
]

# Where the mouse rests on bumpers. The point on the mouse is found by a ray:
#   top / bottom: straight down / up at at = [x, y]   (bottom: under a foot, on the table plane)
#   side: from side = +1 (+X) or -1 at at = [y, z]
#   front / back: from -Y / +Y at at = [x, z]
# r is the radius of the landing; bumper_d a smaller bumper than [parts] bumper, if needed.
contacts = [
  { name = "nose",    ray = "top",    at = [0.0, -41.2],  r = 2.5, bumper_d = 4.5, en = "nose in front of the wheel", ru = "носик перед колесом" },
  { name = "strip",   ray = "top",    at = [0.0, 4.0],    r = 4.5, en = "strip behind SmartShift", ru = "полоса за SmartShift" },
  { name = "back_l",  ray = "top",    at = [-17.0, 30.0], r = 4.5, en = "back, side", ru = "сзади сбоку" },
  { name = "back_r",  ray = "top",    at = [17.0, 30.0],  r = 4.5, en = "back, side", ru = "сзади сбоку" },
  { name = "back_c",  ray = "top",    at = [0.0, 40.0],   r = 4.5, en = "back, centre", ru = "сзади по центру" },
  { name = "foot_fl", ray = "bottom", at = [-14.0, -35.0], r = 4.5, en = "under a front foot", ru = "под передней ножкой" },
  { name = "foot_fr", ray = "bottom", at = [14.0, -35.0], r = 4.5, en = "under a front foot", ru = "под передней ножкой" },
  { name = "foot_bl", ray = "bottom", at = [-16.5, 27.0], r = 4.5, en = "under a back foot", ru = "под задней ножкой" },
  { name = "foot_br", ray = "bottom", at = [16.5, 27.0],  r = 4.5, en = "under a back foot", ru = "под задней ножкой" },
  { name = "side_l",  ray = "side", side = -1, at = [15.0, 4.0], r = 4.0, en = "side", ru = "бок" },
  { name = "side_r",  ray = "side", side = 1,  at = [15.0, 4.0], r = 4.0, en = "side", ru = "бок" },
  { name = "front_l", ray = "front",  at = [-14.0, 4.0],  r = 3.0, en = "front, next to USB-C", ru = "перёд, рядом с USB-C" },
  { name = "front_r", ray = "front",  at = [14.0, 4.0],   r = 3.0, en = "front, next to USB-C", ru = "перёд, рядом с USB-C" },
]

[design]
lattice = "voronoi"
composition = "heel"
cell_open = 11.0
cell_fine = 5.0
fine_near = "hinge"
rib = "wedge"
rib_width = 3.6
form = "symmetric"
parting = "tilted"
lip = "inner"
hinge = "front"
contacts = "nodes"
notch = "chamfer"
notch_size = [20.0, 3.0, 2.5]
colors = { lid = "white-transparent", base = "gray" }

[parts]
material = "PETG"
rod = 3.0
magnet = [6.0, 2.0]
bumper = [6.0, 2.0]

[print]
order_language = "ru"
